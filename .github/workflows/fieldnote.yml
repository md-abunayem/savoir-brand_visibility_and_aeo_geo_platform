name: Fieldnote browser verification
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Select a single operation
        required: true
        default: qualify
        type: choice
        options: [qualify, account, title, faq-before, faq-after]
permissions:
  contents: read
concurrency:
  group: fieldnote-demonstration
  cancel-in-progress: false
jobs:
  run:
    if: >-
      github.repository == 'md-abunayem/savoir-brand_visibility_and_aeo_geo_platform' &&
      github.actor == 'md-abunayem' && github.triggering_actor == github.actor &&
      github.ref == 'refs/heads/main' && !github.event.repository.fork &&
      github.event.repository.visibility == 'public' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: fieldnote-reviewed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: false
      - name: Install tools before loading credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/fieldnote-tools" --no-audit --no-fund @testmuai/kane-cli@0.10.9
          sudo apt-get -qq update
          sudo apt-get -qq install -y haproxy nftables
      - name: Run the selected stage
        env:
          STAGE: ${{ inputs.stage }}
          LT_USERNAME: ${{ inputs.stage != 'qualify' && secrets.LT_USERNAME || '' }}
          LT_ACCESS_KEY: ${{ inputs.stage != 'qualify' && secrets.LT_ACCESS_KEY || '' }}
          VERIFICATION_EVIDENCE_KEY: ${{ inputs.stage != 'qualify' && secrets.VERIFICATION_EVIDENCE_KEY || '' }}
          APPROVED_RUN: ${{ vars.APPROVED_RUN }}
          APPROVED_SHA: ${{ vars.APPROVED_SHA }}
          APPROVED_STAGE: ${{ vars.APPROVED_STAGE }}
          ZERO_CHARGE: ${{ vars.ZERO_CHARGE }}
          UPLOAD_HOST: ${{ vars.UPLOAD_HOST }}
          VAULT_HOST: ${{ vars.VAULT_HOST }}
          VAULT_PROBE_URL: ${{ inputs.stage != 'qualify' && inputs.stage != 'account' && secrets.VAULT_PROBE_URL || '' }}
          ADMISSION_URL: ${{ inputs.stage != 'qualify' && inputs.stage != 'account' && secrets.ADMISSION_URL || '' }}
          CASE_INPUT_URL: ${{ startsWith(inputs.stage, 'faq-') && secrets.CASE_INPUT_URL || '' }}
          CASE_OUTPUT_URL: ${{ inputs.stage != 'qualify' && secrets.CASE_OUTPUT_URL || '' }}
        run: bash ci/runner.sh
